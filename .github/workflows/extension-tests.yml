on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - master

name: Extension Tests

permissions:
  contents: read

jobs:
  regress:
    name: pg${{ matrix.pg-version }}
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    strategy:
      fail-fast: false
      matrix:
        pg-version: [16, 17, 18]

    container: postgres:${{ matrix.pg-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pg_regress lives in the -dev package. The extensions themselves need
      # nothing to build, this is purely so the test harness is available.
      - name: Install test harness
        run: |
          apt-get -qq update
          apt-get -qq -y --no-install-recommends install make postgresql-server-dev-${{ matrix.pg-version }}

      - name: Start PostgreSQL
        run: |
          # installcheck runs as postgres and writes its results into the
          # checkout. Only the checkout: /__w also holds the runner's own
          # files, and taking those away from it fails every later step with
          # "Access to the path .../event.json is denied".
          chown -R postgres "$GITHUB_WORKSPACE"
          su postgres -c "/usr/lib/postgresql/${{ matrix.pg-version }}/bin/initdb -D /tmp/pgdata"
          su postgres -c "/usr/lib/postgresql/${{ matrix.pg-version }}/bin/pg_ctl -D /tmp/pgdata -l /tmp/pg.log -o '-k /tmp' start"

      - name: Install extensions
        run: |
          ./pg_statecharts/install.sh
          ./pg_statecharts_dev/install.sh

      # install.sh is the single implementation of "assemble and lay out the
      # extension files" -- scripts/package_release.sh builds the debs with it
      # -- and the claim that make install produces the same files is what
      # makes that safe. They agree today; this is what keeps them agreeing
      # when a part is added to parts.txt or the generated header changes.
      - name: Check install.sh and make install agree
        run: |
          set -eu
          EXT_DIR="$(pg_config --sharedir)/extension"
          for ext in pg_statecharts pg_statecharts_dev; do
            version=$(sed -n "s/^default_version *= *'\([^']*\)'.*/\1/p" "$ext/$ext.control")
            cp "$EXT_DIR/$ext--$version.sql" "/tmp/$ext-from-sh.sql"
            make -C "$ext" install >/dev/null
            diff "/tmp/$ext-from-sh.sql" "$EXT_DIR/$ext--$version.sql"
          done

      - name: Run tests
        env:
          PGHOST: /tmp
          PGUSER: postgres
        run: |
          set -e
          for ext in pg_statecharts pg_statecharts_dev; do
            su postgres -c "make -C $ext installcheck PGHOST=/tmp PGUSER=postgres"
          done

      - name: Show diffs on failure
        if: failure()
        run: |
          for f in pg_statecharts/test/regression.diffs pg_statecharts_dev/test/regression.diffs; do
            [ -f "$f" ] && { echo "=== $f ==="; cat "$f"; }
          done
          cat /tmp/pg.log || true

  upgrade:
    name: upgrade from sqitch
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    container: postgres:18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get -qq update
          apt-get -qq -y --no-install-recommends install make gcc postgresql-server-dev-18 pgxnclient ca-certificates sqitch

      # The sqitch deployment used the semver extension, so the upgrade path
      # can only be exercised with it present.
      - name: Install semver
        run: pgxn install semver

      - name: Start PostgreSQL
        run: |
          su postgres -c "/usr/lib/postgresql/18/bin/initdb -D /tmp/pgdata"
          su postgres -c "/usr/lib/postgresql/18/bin/pg_ctl -D /tmp/pgdata -l /tmp/pg.log -o '-k /tmp' start"

      - name: Install extension
        run: ./pg_statecharts/install.sh

      # pg_dump leaves out an extension's tables unless it registers them, and
      # 0.0.0 never did. Dump a database with a running machine, restore it and
      # compare, which also drives the fsm triggers under pg_restore's empty
      # search_path.
      - name: Check pg_dump includes the fsm tables and the dump restores
        env:
          PGHOST: /tmp
          PGUSER: postgres
        run: .github/scripts/check_dump_restore.sh

      # A database deployed from deploy/ with sqitch has every object already;
      # the 'sqitch' version adopts them and the update then converts the
      # version column off the semver extension and drops it. The result has to
      # own exactly what a fresh install owns.
      - name: Check a sqitch deployment can be adopted and upgraded
        env:
          PGHOST: /tmp
          PGUSER: postgres
        run: .github/scripts/check_sqitch_adoption.sh

      # Nothing of ours is called to_semver in the same schema as semver's own,
      # so the two extensions can now be installed side by side.
      - name: Check pg_statecharts installs alongside semver
        env:
          PGHOST: /tmp
          PGUSER: postgres
        run: .github/scripts/check_semver_coexistence.sh

  # The PGXN archives are the one artifact nothing else checks: the debs are
  # smoke tested in the release workflow and install.sh is covered above. They
  # are also the artifact with no way back -- PGXN refuses to overwrite or
  # delete a released version, so the only answer to a bad upload is to burn a
  # version number. Cheaper to find out on the pull request.
  pgxn:
    name: PGXN archives
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    container: postgres:18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get -qq update
          apt-get -qq -y --no-install-recommends install make postgresql-server-dev-18 zip unzip

      - name: Build the archives
        run: |
          make -C pg_statecharts dist
          make -C pg_statecharts_dev dist

      # PGXN wants a single directory named <distribution>-<version> with
      # META.json at its root. Manager silently rewrites an archive that is
      # shaped differently, so a mistake here is invisible until someone
      # downloads the rewritten result.
      - name: Check the layout PGXN expects
        run: |
          set -eu
          for z in pg_statecharts/pg_statecharts-*.zip pg_statecharts_dev/pg_statecharts_dev-*.zip; do
            roots=$(unzip -Z1 "$z" | cut -d/ -f1 | sort -u)
            if [ "$(printf '%s\n' "$roots" | wc -l)" -ne 1 ]; then
              echo "$z has more than one top level entry:" >&2
              printf '%s\n' "$roots" >&2
              exit 1
            fi
            unzip -Z1 "$z" | grep -qE '^[^/]+/META\.json$' \
              || { echo "$z has no META.json at the root of $roots" >&2; exit 1; }
            echo "$z: $roots, META.json at its root"
          done

      - name: Collect the archives
        run: |
          mkdir -p dist
          cp pg_statecharts/pg_statecharts-*.zip pg_statecharts_dev/pg_statecharts_dev-*.zip dist/

      - name: Pass the archives on to the install job
        uses: actions/upload-artifact@v4
        with:
          name: pgxn-archives
          path: dist/*
          if-no-files-found: error

  # Deliberately does not check the repository out. Whatever is missing from an
  # archive cannot be quietly supplied by a file that happens to be lying
  # around, which is the whole question this job answers: can someone who has
  # only the zip install and use the extension?
  pgxn-install:
    name: PGXN archives install clean
    needs: pgxn
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    container: postgres:18

    steps:
      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          name: pgxn-archives
          path: /archives

      - name: Install build tools
        run: |
          apt-get -qq update
          apt-get -qq -y --no-install-recommends install make postgresql-server-dev-18 unzip

      - name: Unpack
        run: |
          mkdir -p /pgxn
          for z in /archives/*.zip; do unzip -q "$z" -d /pgxn; done
          ls -1 /pgxn

      - name: Start PostgreSQL
        run: |
          su postgres -c "/usr/lib/postgresql/18/bin/initdb -D /tmp/pgdata"
          su postgres -c "/usr/lib/postgresql/18/bin/pg_ctl -D /tmp/pgdata -l /tmp/pg.log -o '-k /tmp' start"

      # make && make install is what "pgxn install" runs.
      - name: Install from the archives
        run: |
          set -eu
          for d in /pgxn/*/; do
            make -C "$d"
            make -C "$d" install
          done

      - name: Create both extensions
        run: |
          su postgres -c "psql -h /tmp -v ON_ERROR_STOP=1 \
            -c 'create extension pg_statecharts cascade' \
            -c 'create extension pg_statecharts_dev'"

      # The archives ship their own tests, so they can answer for themselves.
      # This also exercises the dev extension reading and writing files on the
      # database host, which is the part most likely to miss a shipped fixture.
      - name: Run the tests the archives ship
        run: |
          set -eu
          chown -R postgres /pgxn
          for d in /pgxn/*/; do
            su postgres -c "make -C $d installcheck PGHOST=/tmp PGUSER=postgres"
          done

      - name: Show diffs on failure
        if: failure()
        run: |
          for f in /pgxn/*/test/regression.diffs; do
            [ -f "$f" ] && { echo "=== $f ==="; cat "$f"; }
          done
          cat /tmp/pg.log || true
