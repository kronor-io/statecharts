on:
  push:
    tags:
      - 'v*'
  # Pull requests build and smoke test the very same packages and attach them
  # to the workflow run, so they can be tried out before anything is released.
  # Only a tag push publishes a GitHub release.
  #
  # TEMPORARY, for reviewing #44. Remove these two triggers once it is merged:
  # releases should happen only when a version bump lands on master and gets
  # tagged, and the packaging is exercised by the tag run itself.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - master
  workflow_dispatch:

name: Release

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the extension version
        run: |
          set -eu
          CONTROL_VERSION=$(sed -n "s/^default_version *= *'\([^']*\)'.*/\1/p" \
            pg_statecharts/pg_statecharts.control)
          echo "version=$CONTROL_VERSION" >> "$GITHUB_ENV"

      - name: Check the tag matches the extension version
        if: github.ref_type == 'tag'
        run: |
          set -eu
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$version" != "$TAG_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match default_version $version" >&2
            echo "in pg_statecharts/pg_statecharts.control" >&2
            exit 1
          fi

      # Nothing is compiled, so there is no build matrix: one tarball works
      # everywhere, and the .deb per PostgreSQL major exists only because
      # Debian puts extensions under a versioned path. All of it takes seconds.
      - name: Build packages
        run: ./scripts/package_release.sh dist

      # The runtime deb has to stand on its own, and the dev deb has to refuse
      # to install without it, or the split buys nothing.
      - name: Smoke test the packages
        run: |
          set -eu
          for pg in 16 17 18; do
            docker run --rm -d --name smoke$pg \
              -e POSTGRES_PASSWORD=x -e POSTGRES_HOST_AUTH_METHOD=trust postgres:$pg
            for i in $(seq 30); do
              docker exec smoke$pg pg_isready -U postgres >/dev/null 2>&1 && break
              sleep 1
            done
            docker cp "dist/pg-statecharts-${pg}_${version}_all.deb" smoke$pg:/tmp/runtime.deb
            docker cp "dist/pg-statecharts-dev-${pg}_${version}_all.deb" smoke$pg:/tmp/dev.deb

            # dev alone must fail on the missing dependency, and must not leave
            # anything behind that would make the later checks pass by accident
            if docker exec smoke$pg dpkg -i /tmp/dev.deb; then
              echo "pg$pg: dev package installed without the runtime package" >&2
              exit 1
            fi
            docker exec smoke$pg dpkg --purge pg-statecharts-dev-$pg

            # runtime alone must work, and must not ship the dev files
            docker exec smoke$pg dpkg -i /tmp/runtime.deb
            if docker exec smoke$pg test -e /usr/share/postgresql/$pg/extension/pg_statecharts_dev.control; then
              echo "pg$pg: runtime package contains the dev extension" >&2
              exit 1
            fi
            docker exec smoke$pg psql -U postgres -v ON_ERROR_STOP=1 \
              -c 'create extension pg_statecharts cascade'

            # dev on top of runtime must work
            docker exec smoke$pg dpkg -i /tmp/dev.deb
            docker exec smoke$pg psql -U postgres -v ON_ERROR_STOP=1 \
              -c 'create extension pg_statecharts_dev'
            docker rm -f smoke$pg
            echo "pg$pg ok"
          done

      # 0.0.0 was the Rust build, published as a plain "pg-statecharts" deb
      # that owns the same control file. The runtime package declares that it
      # replaces it, so installing over it has to remove the old package rather
      # than fail on the file conflict. The 0.0.0 release only has PG 18 for
      # x86_64, which is what the runner is.
      - name: Smoke test taking over the 0.0.0 package
        run: |
          set -eu
          curl -fsSL -o old.deb \
            https://github.com/kronor-io/statecharts/releases/download/v0.0.0/pg_statecharts_0.0.0_pg18_Linux_x86_64.deb
          docker run --rm -d --name takeover \
            -e POSTGRES_PASSWORD=x -e POSTGRES_HOST_AUTH_METHOD=trust postgres:18
          for i in $(seq 30); do
            docker exec takeover pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          docker cp old.deb takeover:/tmp/old.deb
          docker cp "dist/pg-statecharts-18_${version}_all.deb" takeover:/tmp/runtime.deb
          docker exec takeover dpkg -i /tmp/old.deb
          docker exec takeover dpkg -i /tmp/runtime.deb

          if [ "$(docker exec takeover dpkg-query -W -f '${db:Status-Status}' pg-statecharts 2>/dev/null)" = installed ]; then
            echo "the 0.0.0 package is still installed" >&2
            exit 1
          fi
          if docker exec takeover test -e /usr/lib/postgresql/18/lib/pg_statecharts.so; then
            echo "the 0.0.0 shared library was left behind" >&2
            exit 1
          fi
          docker exec takeover psql -U postgres -v ON_ERROR_STOP=1 -tAq \
            -c 'create extension pg_statecharts cascade' \
            -c "select extversion from pg_extension where extname = 'pg_statecharts'" \
            | grep -qx "$version" || { echo "installed extension is not $version" >&2; exit 1; }
          docker rm -f takeover
          echo "takeover ok"

      - name: Attach packages to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: pg_statecharts-${{ env.version }}
          path: dist/*
          if-no-files-found: error

      - name: Create release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          name: Release ${{ env.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
